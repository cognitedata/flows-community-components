name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: chromatic-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Resolve Chromatic project token
        id: chromatic_token
        shell: bash
        env:
          TOKEN_FLOWS: ${{ secrets.CHROMATIC_TOKEN_FLOWS_COMMUNITY }}
          TOKEN_AURA: ${{ secrets.CHROMATIC_TOKEN_AURA }}
        run: |
          if [ -n "$TOKEN_FLOWS" ]; then
            echo "token=$TOKEN_FLOWS" >> "$GITHUB_OUTPUT"
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$TOKEN_AURA" ]; then
            echo "token=$TOKEN_AURA" >> "$GITHUB_OUTPUT"
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Chromatic project token configured; skipping Chromatic publish."
          fi

      - name: Setup Node.js and pnpm
        if: steps.chromatic_token.outputs.has_token == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Publish to Chromatic
        if: steps.chromatic_token.outputs.has_token == 'true'
        uses: chromaui/action@v18.0.1
        with:
          projectToken: ${{ steps.chromatic_token.outputs.token }}
          buildScriptName: build-storybook
          exitOnceUploaded: true
          onlyChanged: true
          autoAcceptChanges: main
