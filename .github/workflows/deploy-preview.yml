name: Build PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  pull-requests: write
  actions: write

concurrency:
  group: 'preview-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')
          echo "name=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "original=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build registry
        run: pnpm run registry:build

      - name: Get Pages URL
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Resolve Pages base path
        id: pages_base
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE" ]; then
            BASE="/${{ github.event.repository.name }}"
            echo "configure-pages did not return a base path; using $BASE"
          fi
          echo "base_path=$BASE" >> "$GITHUB_OUTPUT"

      - name: Build with Vite
        run: pnpm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages_base.outputs.base_path }}/branches/${{ steps.branch.outputs.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add branch metadata
        env:
          NAME: ${{ steps.branch.outputs.name }}
          ORIGINAL: ${{ steps.branch.outputs.original }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n '{name: env.NAME, original: env.ORIGINAL, pr: env.PR, title: env.TITLE, sha: env.SHA}' \
            > dist/_branch-meta.json

      - name: Upload preview artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: branch-preview-${{ steps.branch.outputs.name }}
          path: dist
          retention-days: 30
          overwrite: true

      # The live link is posted by deploy.yml once Pages has deployed.
      - name: Comment on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { postPending } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.cjs`);
            await postPending({ github, context, sha: context.payload.pull_request.head.sha });

      - name: Trigger deploy workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            console.log('Triggered deploy workflow');
