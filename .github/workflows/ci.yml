name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-typecheck-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Type check
        run: pnpm exec tsc -b --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Verify registry is up to date
        run: pnpm run registry:check

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build registry
        run: pnpm run registry:build

      - name: Build docs site
        run: pnpm run build
        env:
          PAGES_BASE_PATH: /aura

      - name: Verify GitHub Pages SPA fallback
        run: test -f dist/404.html && test -f dist/.nojekyll

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          STORYBOOK_BASE_PATH: /aura/storybook

  storybook-interactions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook interaction tests
        run: pnpm run test:storybook:ci
