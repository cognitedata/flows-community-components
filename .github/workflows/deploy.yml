name: Deploy Flows Community to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build registry
        run: pnpm run registry:build

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build with Vite
        run: pnpm run build
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          STORYBOOK_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}/storybook

      - name: Prepare branches directory
        run: mkdir -p dist/branches

      - name: Download branch preview artifacts
        id: branches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const branchArtifacts = artifacts.filter(a =>
              a.name.startsWith('branch-preview-') && !a.expired
            );

            const seen = new Set();
            const latestBranchArtifacts = branchArtifacts.filter(a => {
              if (seen.has(a.name)) return false;
              seen.add(a.name);
              return true;
            });

            console.log(`Found ${latestBranchArtifacts.length} branch preview artifacts (${branchArtifacts.length} total, deduplicated)`);

            const manifest = { branches: [] };

            for (const artifact of latestBranchArtifacts) {
              const branchName = artifact.name.replace('branch-preview-', '');
              console.log(`Downloading ${artifact.name}...`);

              try {
                const { data } = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });

                const zipPath = `/tmp/${artifact.name}.zip`;
                fs.writeFileSync(zipPath, Buffer.from(data));

                const branchDir = `dist/branches/${branchName}`;
                fs.mkdirSync(branchDir, { recursive: true });
                execSync(`unzip -o ${zipPath} -d ${branchDir}`);

                const metaPath = `${branchDir}/_branch-meta.json`;
                let branchMeta = { name: branchName, updated: artifact.updated_at };

                if (fs.existsSync(metaPath)) {
                  try {
                    const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
                    branchMeta = { ...meta, updated: artifact.updated_at };
                    fs.unlinkSync(metaPath);
                  } catch (e) {
                    console.log(`Could not read metadata for ${branchName}`);
                  }
                }

                manifest.branches.push(branchMeta);
                console.log(`Extracted ${artifact.name} to ${branchDir}`);
              } catch (e) {
                console.log(`Failed to download ${artifact.name}: ${e.message}`);
              }
            }

            fs.writeFileSync('dist/branches/manifest.json', JSON.stringify(manifest, null, 2));
            core.setOutput('branches', JSON.stringify(manifest.branches));
            console.log(`Manifest: ${manifest.branches.length} branches`);

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  comment:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          sparse-checkout: .github/scripts

      - name: Post preview links on PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BRANCHES: ${{ needs.build.outputs.branches }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const { postDeployed } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.cjs`);
            await postDeployed({
              github,
              context,
              pageUrl: process.env.PAGE_URL,
              branches: JSON.parse(process.env.BRANCHES || '[]'),
            });
