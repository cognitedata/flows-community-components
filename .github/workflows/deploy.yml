name: Deploy Vite site to Pages

on:
  # Runs on pushes targeting the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build with Vite
        run: pnpm run build
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}

      - name: Prepare branches directory
        run: mkdir -p dist/branches

      - name: Download branch preview artifacts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // List all artifacts
            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            // Filter for branch previews (not expired)
            const branchArtifacts = artifacts.filter(a =>
              a.name.startsWith('branch-preview-') && !a.expired
            );

            // Deduplicate: keep only the most recent artifact per branch name
            // (API returns newest first, so first occurrence wins)
            const seen = new Set();
            const latestBranchArtifacts = branchArtifacts.filter(a => {
              if (seen.has(a.name)) return false;
              seen.add(a.name);
              return true;
            });

            console.log(`Found ${latestBranchArtifacts.length} branch preview artifacts (${branchArtifacts.length} total, deduplicated)`);

            const manifest = { branches: [] };

            for (const artifact of latestBranchArtifacts) {
              const branchName = artifact.name.replace('branch-preview-', '');
              console.log(`Downloading ${artifact.name}...`);

              try {
                const { data } = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });

                const zipPath = `/tmp/${artifact.name}.zip`;
                fs.writeFileSync(zipPath, Buffer.from(data));

                const branchDir = `dist/branches/${branchName}`;
                fs.mkdirSync(branchDir, { recursive: true });
                execSync(`unzip -o ${zipPath} -d ${branchDir}`);

                // Read branch metadata if available
                const metaPath = `${branchDir}/_branch-meta.json`;
                let branchMeta = { name: branchName, updated: artifact.updated_at };

                if (fs.existsSync(metaPath)) {
                  try {
                    const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
                    branchMeta = { ...meta, updated: artifact.updated_at };
                    fs.unlinkSync(metaPath); // Remove meta file from output
                  } catch (e) {
                    console.log(`Could not read metadata for ${branchName}`);
                  }
                }

                manifest.branches.push(branchMeta);
                console.log(`Extracted ${artifact.name} to ${branchDir}`);
              } catch (e) {
                console.log(`Failed to download ${artifact.name}: ${e.message}`);
              }
            }

            // Write manifest
            fs.writeFileSync('dist/branches/manifest.json', JSON.stringify(manifest, null, 2));
            console.log(`Manifest: ${manifest.branches.length} branches`);

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
